name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Core behavior
        run: npx --yes --package fengari-node-cli fengari tests/core_spec.lua

      - name: Lookup behavior
        run: npx --yes --package fengari-node-cli fengari tests/lookup_spec.lua

      - name: Server command contract
        run: python3 tests/verify_server_catalog.py

      - name: Lua syntax
        run: |
          npx --yes luaparse -q Data.lua
          npx --yes luaparse -q Core.lua
          npx --yes luaparse -q Lookup.lua
          npx --yes luaparse -q UI.lua
          npx --yes luaparse -q ResultsUI.lua
